<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ulaanbaatar Curated Sanctuaries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<button class="menu-btn" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="menuPanel">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
</button>

<div class="scrim" id="menuScrim"></div>
<nav class="menu" id="menuPanel" aria-label="Main menu" aria-hidden="true">
  <div class="menu__head">
    <a class="brand" href="#top">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>Very cool ysu</span>
    </a>
    <button class="icon-btn" id="menuClose" aria-label="Close menu"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  </div>

  <div class="menu__group">
    <p class="menu__label" id="lblLang">Language</p>
    <select id="langSelect" class="field" aria-label="Language">
      <option value="en">English (EN)</option>
      <option value="mn">Монгол (MN)</option>
      <option value="zh">中文 (CH)</option>
      <option value="ko">한국어 (KR)</option>
    </select>
  </div>

  <div class="menu__group">
    <p class="menu__label" id="lblCategory">Category</p>
    <div class="opts" id="categoryFilters">
      <button class="opt active" data-filter="all" id="btnAll">All Places</button>
      <button class="opt" data-filter="Cafe" id="btnCafes">Cafes</button>
      <button class="opt" data-filter="Restaurant" id="btnRests">Restaurants</button>
    </div>
  </div>

  <div class="menu__group">
    <p class="menu__label" id="lblVibe">Vibe</p>
    <div class="opts" id="vibeFilters">
      <button class="opt active" data-vibe="all" id="btnAllVibes">All Vibes</button>
      <button class="opt" data-vibe="studying" id="btnStudy">Studying</button>
      <button class="opt" data-vibe="family" id="btnFamily">Family</button>
      <button class="opt" data-vibe="chill" id="btnChill">Chill & Beer</button>
    </div>
  </div>

  <button class="btn btn--primary btn--block menu__done" id="menuDone">Show results</button>
</nav>

<main id="top">
  <section class="hero wrap">
    <p class="eyebrow" id="venueCountBadge">Ulaanbaatar · 0 venues</p>
    <h1 id="headerTitle">Ulaanbaatar Curated Spots</h1>
    <p class="hero__sub" id="headerSubtitle">A niche directory of authentic local cafes and restaurants tailored for studying, family gatherings, and cold beers.</p>
  </section>

  <section class="controls wrap" aria-label="Search">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="searchInput" class="field" placeholder="Search by venue name, address, or vibe...">
    </label>
  </section>

  <section class="wrap"><div class="grid" id="listingsGrid"></div></section>
</main>

<div class="overlay overlay--side" id="venueModal">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="icon-btn panel__close" id="modalClose" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <p class="eyebrow" id="modalTypeVibe"></p>
    <h2 class="panel__title" id="modalTitle"></h2>
    <p class="panel__addr" id="modalAddress"></p>
    <a href="#" id="modalMapsLink" target="_blank" rel="noopener" class="btn btn--outline">Open in Google Maps</a>
    <h3 class="panel__label" id="seatingVibeLabel">General Table & Seating Vibe</h3>
    <div class="note" id="modalVibeDesc"></div>
  </div>
</div>

<script src="data/i18n.js"></script>
<script src="data/venues.js"></script>
<script src="app.js"></script>
</body>
</html>
